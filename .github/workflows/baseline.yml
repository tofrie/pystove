name: Compatibility baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development tools
        run: python -m pip install --requirement requirements-dev.txt
      - name: Install the baseline package
        run: python -m pip install --no-build-isolation --editable .
      - name: Characterize compatibility and known failures
        run: python -m pytest
      - name: Check lint without changing files
        run: python -m ruff check .
      - name: Build sdist and wheel in isolation
        run: python -m build
      - name: Validate wheel and sdist
        run: python ci/validate_package.py --dist-dir dist
      - name: Prove metadata and builds need no runtime dependencies
        run: python ci/check_isolated_build.py
      - name: Test imports and contracts from the installed wheel
        run: python ci/test_wheel.py --dist-dir dist
