name: PyPI rc3 (verify by default)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Verify only, or explicitly request publication
        type: choice
        options: [verify, publish]
        default: verify
        required: true
      confirmation:
        description: 'For publication enter: publish saynwerk-pystove==0.3.0rc3'
        type: string
        default: ''
        required: false
      verified_run_id:
        description: 'For publish: successful manual VERIFY run ID at this exact workflow commit'
        type: string
        default: ''
        required: false
  # Ordinary events exercise only the non-publishing path.
  push:
    branches: [release/saynwerk-pystove-0.3.0rc3]
    paths:
      - .github/workflows/publish-pypi.yml
      - ci/pypi_release.py
      - tests/test_trusted_publishing.py
  pull_request:
    paths:
      - .github/workflows/publish-pypi.yml
      - ci/pypi_release.py
      - tests/test_trusted_publishing.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      SOURCE_DATE_EPOCH: '1791058066'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: control
          persist-credentials: false
      - name: Checkout approved package source only for VERIFY
        if: inputs.mode != 'publish'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: tofrie/pystove
          ref: 9aebfd71a5d58cb00c4b29baf3b308310d9947d3
          path: release-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.6'
      - name: Install verification tools only (no PyPI credentials)
        if: inputs.mode != 'publish'
        run: |
          python -m pip install -r release-source/requirements-dev.txt
          python -m pip install twine==7.0.0 'readme_renderer[md]==46.0'
          python -I release-source/ci/check_release_install.py --empty
          python -m pip install --no-build-isolation --editable release-source
      - name: Test fail-closed release safeguards
        if: inputs.mode != 'publish'
        working-directory: control
        run: python -m pytest -q tests/test_trusted_publishing.py
      - name: Reproduce only the approved commit and require both approved hashes
        if: inputs.mode != 'publish'
        run: python control/ci/pypi_release.py build --source release-source --dist-dir dist
      - name: Approved-source tests and installed-wheel contracts
        if: inputs.mode != 'publish'
        working-directory: release-source
        run: |
          python -m pytest -q -W error::ResourceWarning --junitxml=../release-results.xml
          python ci/check_test_results.py ../release-results.xml
          python -m ruff check .
          python ci/test_wheel.py --dist-dir ../dist
      - name: Strict metadata check
        if: inputs.mode != 'publish'
        run: python -m twine check --strict dist/*
      - name: Require a successful VERIFY of this exact workflow commit
        if: inputs.mode == 'publish'
        id: approved
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
        run: python control/ci/pypi_release.py verified-run --run-id "$VERIFIED_RUN_ID" --head "$GITHUB_SHA" --output "$GITHUB_OUTPUT"
      - name: Reuse approved VERIFY files without rebuilding
        if: inputs.mode == 'publish'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          repository: tofrie/pystove
          run-id: ${{ steps.approved.outputs.run_id }}
          artifact-ids: ${{ steps.approved.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - name: Require exactly the approved file set and hashes
        run: python control/ci/pypi_release.py verify --dist-dir dist
      - name: Store verified files in this run only (not a release or package index)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'tofrie/pystove' &&
          github.ref == 'refs/heads/release/saynwerk-pystove-0.3.0rc3' &&
          (inputs.mode == 'verify' ||
          (inputs.mode == 'publish' &&
          inputs.confirmation == 'publish saynwerk-pystove==0.3.0rc3'))
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-saynwerk-pystove-0.3.0rc3
          path: dist/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  authorize:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'tofrie/pystove' &&
      github.ref == 'refs/heads/release/saynwerk-pystove-0.3.0rc3' &&
      inputs.mode == 'publish' &&
      inputs.confirmation == 'publish saynwerk-pystove==0.3.0rc3'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require the existing pypi environment and exact release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/tofrie/pystove/environments/pypi > "$RUNNER_TEMP/pypi-environment.json"
          gh api repos/tofrie/pystove/environments/pypi/deployment-branch-policies > "$RUNNER_TEMP/pypi-branches.json"
          python3 ci/pypi_release.py environment --config "$RUNNER_TEMP/pypi-environment.json" --branches "$RUNNER_TEMP/pypi-branches.json"

  publish:
    needs: [verify, authorize]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'tofrie/pystove' &&
      github.ref == 'refs/heads/release/saynwerk-pystove-0.3.0rc3' &&
      inputs.mode == 'publish' &&
      inputs.confirmation == 'publish saynwerk-pystove==0.3.0rc3'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/saynwerk-pystove/
    concurrency:
      group: pypi-saynwerk-pystove-0.3.0rc3
      cancel-in-progress: false
    permissions:
      id-token: write
    steps:
      # No checkout, package installation, build or execution of release code here.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: approved-saynwerk-pystove-0.3.0rc3
          path: dist
      - name: Independently recheck exact artifact set and hashes before OIDC upload
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          expected = {
              'saynwerk_pystove-0.3.0rc3-py3-none-any.whl': '03dc8a11e0db7a8c2e3acff4a03ae6c0a41030dd8247c690755387a6eaadc85a',
              'saynwerk_pystove-0.3.0rc3.tar.gz': 'a49548c8c7f11c27cc30679740eda0d4dba06928f474675c570ab9043d420869',
          }
          files = list(Path('dist').iterdir())
          if {p.name for p in files} != set(expected):
              raise SystemExit('Unexpected release artifact inventory')
          for p in files:
              if p.is_symlink() or not p.is_file():
                  raise SystemExit('Unexpected release file type')
              if hashlib.sha256(p.read_bytes()).hexdigest() != expected[p.name]:
                  raise SystemExit('Approved release hash mismatch; STOP')
      - name: Publish approved RC with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 pinned
        with:
          packages-dir: dist/
          repository-url: https://upload.pypi.org/legacy/
          skip-existing: false
          attestations: true
          verbose: false
